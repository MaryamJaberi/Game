<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1b1a">
<title>میز خدا — اپ گرداننده مافیا</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --bg:#1c1b1a;--panel:#262422;--panel2:#322f2c;--ink:#efe8da;--mute:#a59f92;--line:#3a3633;
  --amber:#d99a3c;--good:#5b9b6f;--bad:#c25a52;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  font-family:Vazirmatn,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{padding:var(--safe-top) 0 var(--safe-bot)}
body.night{--bg:#14171f;--panel:#1d222c;--panel2:#252b37;--amber:#7fa3c9;--line:#2c3340}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.app{height:100dvh;max-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.cta{width:100%;padding:14px 16px;border-radius:14px;font-weight:800;background:var(--amber);color:#1c1b1a}
.cta.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.cta.danger{background:var(--bad);color:#fff}
.row{display:flex;gap:8px}
h1{font-size:22px}
.mute{color:var(--mute);font-size:13px;line-height:1.7}
.setup{overflow:auto;-webkit-overflow-scrolling:touch;padding:22px 18px 28px}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--amber),#8a5a18);display:grid;place-items:center;font-size:22px}
.counter{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:12px 0}
.counter b{font-size:28px}
.counter button{width:42px;height:42px;border-radius:12px;background:var(--panel2);font-size:20px}
.plist{display:grid;gap:8px;margin:10px 0 16px}
.pchip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.pchip span{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-size:12px;color:var(--mute)}
.pchip input{flex:1;background:transparent;border:0;outline:0;min-width:0;padding:6px}
.scens{display:grid;gap:8px;margin:10px 0 18px}
.scen{text-align:right;padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.scen.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.scen strong{display:block;margin-bottom:4px}
.split{font-size:12px;color:var(--mute);margin-bottom:14px}
#game{background:radial-gradient(ellipse at 50% 42%, #2a2622 0%, var(--bg) 70%)}
body.night #game{background:radial-gradient(ellipse at 50% 42%, #1b2230 0%, var(--bg) 70%)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;min-height:36px}
.felt-wrap{flex:1;position:relative;min-height:220px}
.felt{position:absolute;inset:10% 12% 30%;border-radius:50%;background:radial-gradient(circle at 50% 40%,#3a2f24,#241c16 70%);border:3px solid #4a3b2c;box-shadow:inset 0 0 40px #0008}
body.night .felt{background:radial-gradient(circle at 50% 40%,#243044,#151b26 70%);border-color:#2e3b50}
.felt-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;pointer-events:none}
.felt-label .phase{font-size:13px;color:var(--amber);font-weight:800}
.felt-label .sub{font-size:12px;color:var(--mute);margin-top:4px}
.seat{position:absolute;width:72px;transform:translate(-50%,-50%);text-align:center;z-index:2}
.avatar{width:54px;height:54px;margin:0 auto;border-radius:16px;background:var(--panel2);border:2px solid var(--line);display:grid;place-items:center;font-size:22px;position:relative;transition:transform .18s ease,box-shadow .18s}
.seat.alive .avatar{border-color:#c9a46a}
.seat.dead{opacity:.42}
.seat.dead .avatar{filter:grayscale(.8)}
.seat .nm{display:block;font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.seat .rl{display:block;font-size:10px;color:var(--mute)}
.badge{position:absolute;top:-6px;left:-6px;background:var(--amber);color:#1c1b1a;border-radius:8px;font-size:10px;font-weight:800;padding:2px 5px}
.sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:14px 14px calc(12px + var(--safe-bot));max-height:44%;overflow:auto;box-shadow:0 -10px 40px #0006}
.sheet h2{font-size:16px;margin-bottom:4px}
.sheet .actions{display:grid;gap:8px;margin-top:10px}
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.targets button{padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-align:right}
.answer{margin-top:10px;padding:12px;border-radius:12px;text-align:center;font-weight:800}
.answer.pos{background:#3a1d22;color:#f0b4b0}
.answer.neg{background:#1d3328;color:#b7e0c4}
.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-bot));transform:translateX(-50%) translateY(20px);background:#efe8da;color:#1c1b1a;padding:10px 14px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:20;max-width:86%}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.log{font-size:12px;color:var(--mute);line-height:1.7;margin-top:8px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:30;padding:18px}
.modal.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 18px;width:min(360px,100%);text-align:center}
.card .big{font-size:26px;margin:10px 0}
.hold{font-size:12px;color:var(--mute)}
.timer{font-variant-numeric:tabular-nums;font-size:28px;font-weight:800;text-align:center;margin:6px 0}
.timer.warn{color:var(--bad)}
@media(max-width:380px){.seat{width:62px}.avatar{width:46px;height:46px;border-radius:14px;font-size:18px}.felt{inset:12% 8% 32%}}
@media(min-width:720px){.app{max-width:860px}.sheet{max-height:38%}.seat{width:84px}.avatar{width:62px;height:62px}}
</style>
</head>
<body>
<div class="app">
  <section id="setup" class="screen on">
    <div class="setup">
      <div class="hero">
        <div class="mark">♠</div>
        <div>
          <h1>میز خدا</h1>
          <p class="mute">کنترل‌پنل گرداننده — بدون سرور، روی همین گوشی</p>
        </div>
      </div>
      <div class="counter">
        <button type="button" id="decN">−</button>
        <div style="text-align:center"><b id="nLabel">۸</b><div class="mute">بازیکن</div></div>
        <button type="button" id="incN">+</button>
      </div>
      <div class="split" id="split"></div>
      <div class="plist" id="plist"></div>
      <p class="mute">سناریو</p>
      <div class="scens" id="scens"></div>
      <button class="cta" id="startBtn">شروع بازی و پخش نقش</button>
      <div id="resumeBox"></div>
    </div>
  </section>
  <section id="game" class="screen">
    <div class="topbar">
      <button class="pill" id="backBtn">تنظیمات</button>
      <div class="pill" id="scenPill"></div>
      <button class="pill" id="nextPhase">مرحله بعد</button>
    </div>
    <div class="felt-wrap" id="feltWrap">
      <div class="felt">
        <div class="felt-label">
          <div class="phase" id="phaseName">شب نقش‌گردانی</div>
          <div class="sub" id="phaseSub">برای دیدن نقش، روی صندلی بزن</div>
        </div>
      </div>
    </div>
    <aside class="sheet" id="sheet"></aside>
  </section>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"></div>
<script src="./mafia-app.js"></script>
</body>
</html>
